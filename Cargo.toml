[workspace]
resolver = "2"

members = [
    "dedicated_server",
    "orchestrator",
    "gatekeeper",
    "broker_pubsub",
    "shared"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
deadpool-redis = "0.23.0"
tokio = {version = "1.52.3", features = ["full"]}
rocket = {version = "0.5.1", features = ["json"]}
redis = {version = "1.2.1", features = ["tokio-comp"]}

bevy = {version = "0.19.0-rc.1", default-features = false}
game_sockets = {git = "https://github.com/VALERE91/game_sockets"}
uuid = {version = "1.23.1", features = ["v4", "serde"]}

serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"

anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"]}

shared = {path = "./shared"}

bytes = "1"
